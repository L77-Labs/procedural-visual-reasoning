name: 使用反馈 / Usage feedback
description: 报告运行体验、数据使用方式、问题或实验观察
title: "[Feedback] "
body:
  - type: markdown
    attributes:
      value: |
        感谢使用本项目。请勿提交访问令牌、API Key、私有数据或其他敏感信息。
  - type: dropdown
    id: activity
    attributes:
      label: 使用方式
      options:
        - 验证现有数据包
        - 加载默认 SFT 数据
        - 生成新记录
        - 用于训练或评测
        - 阅读或复用生成代码
        - 其他
    validations:
      required: true
  - type: checkboxes
    id: subsets
    attributes:
      label: 涉及的子集
      options:
        - label: cube_fold
        - label: vessels
        - label: cube_opposite
        - label: structure_count
        - label: leak_contrast
        - label: 不涉及特定子集
  - type: textarea
    id: environment
    attributes:
      label: 运行环境
      description: 操作系统、Python 版本，以及与问题相关的依赖版本。
      placeholder: macOS 15, Python 3.12, matplotlib 3.x
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 操作与结果
      description: 请附可复现命令、实际结果和预期结果；若运行成功，也欢迎说明使用方式。
      render: shell
    validations:
      required: true
  - type: textarea
    id: observations
    attributes:
      label: 补充观察
      description: 可选。欢迎填写实验配置、指标、截图或改进建议。
  - type: checkboxes
    id: safety
    attributes:
      label: 提交检查
      options:
        - label: 我确认内容中不包含访问令牌、API Key 或私有数据。
          required: true
